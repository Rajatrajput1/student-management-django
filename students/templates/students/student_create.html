{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'students/style.css' %}" />
    <title>Student_create</title>
</head>
<body>

     <div class="container">

        <!-- Page Header -->
        <div class="form-header">

            <div>
                <h1>
                    {% if student %}
                        Edit Student
                    {% else %}
                        Add Student
                    {% endif %}
                </h1>

                <p>
                    {% if student %}
                        Update student information
                    {% else %}
                        Enter the student's information
                    {% endif %}
                </p>
            </div>

            <a href="{% url 'student_list' %}" class="back-btn">
                ← Back to Students
            </a>

        </div>


        <!-- Form Card -->
        <div class="form-card">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="save-btn">
                    Save Student
                </button>

            </form>


            <!-- Delete button only appears on Edit page -->
            {% if student %}

                <form
                    method="POST"
                    action="{% url 'student_delete' student.student_id %}"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="delete-btn"
                        onclick="return confirm('Are you sure you want to delete this student?');"
                    >
                        Delete Student
                    </button>

                </form>

            {% endif %}

        </div>

    </div>

</body>
</html>
